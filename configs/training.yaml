training:
  seed: 42
  batch_size: 8
  effective_batch_size: 16
  amp: true
  num_workers: 4
  gradient_clip_norm: 1.0
  deterministic: true

  phase1:                  # frozen backbone
    epochs: 4
    lr: 1.0e-3
  phase2:                  # fine-tuning
    epochs: 20
    lr_backbone: 2.0e-5
    lr_head: 1.0e-4
    warmup_epochs: 1
    unfreeze_epochs: 3     # backbone is unfrozen gradually, deepest layers first
    min_lr_ratio: 0.01
    early_stopping_patience: 6
    early_stopping_min_delta: 0.0

  optimizer:
    name: adamw
    weight_decay: 1.0e-4
  scheduler: cosine_warmup

  loss:
    name: weighted_cross_entropy
    task_weights:
      birads: 1.0
      density: 1.0
  class_weights:
    enabled: true
    scheme: balanced       # n / (K * count), normalized to mean 1, Train only

  fusion:
    hidden_dim: 512
    dropout: 0.3
  head:
    dropout: 0.2
  age_branch:
    hidden_dim: 16
    embed_dim: 16

  inference_timing:
    batch_size: 8
    warmup_iters: 3
    iters: 10

selection:
  n_select: 2
  primary_score: mean_macro_f1
  min_birads_f1_fraction_of_best: 0.85   # guard: strong Density must not hide weak BI-RADS
  max_overfit_gap: 0.30                  # train minus validation mean Macro F1 at best epoch
