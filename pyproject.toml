[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanvia"
version = "1.0.0"
description = "SANVIA Stage 1: reproducible multi-task mammography backbone benchmark"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1", "torchvision>=0.16", "numpy", "pandas", "scikit-learn", "pillow", "matplotlib", "seaborn",
  "pyyaml", "mlflow>=2.14", "dvc>=3.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "nbformat"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 130
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "B905", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B017", "F401"]
